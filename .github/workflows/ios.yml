name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project LowBeam.xcodeproj \
            -scheme LowBeam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package IPA and TIPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/LowBeam.app"
          test -d "$APP"
          rm -rf Payload LowBeam.ipa LowBeam.tipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry LowBeam.ipa Payload
          cp LowBeam.ipa LowBeam.tipa
          ls -lh LowBeam.ipa LowBeam.tipa

      - name: Upload unsigned builds
        uses: actions/upload-artifact@v4
        with:
          name: LowBeam-unsigned
          path: |
            ios/LowBeam.ipa
            ios/LowBeam.tipa
          if-no-files-found: error

      - name: Attach builds to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ios/LowBeam.ipa
            ios/LowBeam.tipa
