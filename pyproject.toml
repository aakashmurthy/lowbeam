[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lowbeam"
version = "0.1.0"
description = "Open diagnostic packs and a reference UDS engine for BMW vehicles"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lowbeam = "lowbeam.cli:main"

[tool.setuptools]
packages = ["lowbeam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
